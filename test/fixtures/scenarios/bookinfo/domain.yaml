apiVersion: backstage.io/v1alpha1
kind: Domain
metadata:
  name: cf-idp-integration-tests
  namespace: cf-idp-integration-tests
  title: '[TEST] Contract-First IDP Integration Domain'
  description: Isolated catalog domain for Bookinfo scaffolder integration-test entities.
  annotations:
    contract-first-idp.github.io/scm-provider: github
    contract-first-idp.github.io/scm-host: github.com
    contract-first-idp.github.io/domain-org: contract-first-idp
    contract-first-idp.github.io/domain-repo: software-templates
spec:
  owner: group:default/domain-maintainers
  platformTarget: resource:default/workshop
  groupId: io.github.cfidp
  environments:
    order: [dev, test, prod]
    build: dev
    definitions:
      dev: {namespaceSuffix: -dev}
      test: {namespaceSuffix: -test}
      prod: {namespaceSuffix: ''}
